[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-stock-investment-system"
version = "0.1.0"
description = "Local-first personal stock investment workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.0",
    "pandas>=2.2",
    "streamlit>=1.35",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
pdf = ["pymupdf4llm>=0.0.27"]
asr = [
    "accelerate>=1.0",
    "datasets[audio]>=3.0",
    "openai-whisper @ git+https://github.com/Splend1d/whisper-patch-breeze.git@f94c6ba670a35ee8d720d4221e102f4685c288d6",
    "torch>=2.3",
    "transformers>=4.45",
]
asr-openvino = [
    "numpy>=1.24",
    "openvino>=2026.0",
    "optimum-intel[openvino]>=2.1",
    "transformers>=4.51",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
