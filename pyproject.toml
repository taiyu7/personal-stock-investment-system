[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-stock-investment-system"
version = "0.1.0"
description = "Local-first personal stock investment workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.0",
    "pandas>=2.2",
    "streamlit>=1.35",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
