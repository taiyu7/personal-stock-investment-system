services:
  app:
    build:
      context: .
    image: personal-stock-investment-system-dev
    working_dir: /app
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      TIMEZONE: Asia/Taipei
      DATABASE_URL: sqlite:///data/local/personal-stock-investment.db
      ENABLE_LIVE_TRADING: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESEARCH_ANALYSIS_MODEL: ${OPENAI_RESEARCH_ANALYSIS_MODEL:-gpt-4.1-mini}
      OPENAI_RESEARCH_ANALYSIS_WEB_SEARCH: ${OPENAI_RESEARCH_ANALYSIS_WEB_SEARCH:-true}
      OPENAI_AUDIO_TRANSCRIPTION_MODEL: ${OPENAI_AUDIO_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_AUDIO_CHUNK_LENGTH_SECONDS: ${OPENAI_AUDIO_CHUNK_LENGTH_SECONDS:-180}
      OPENAI_AUDIO_OUTPUT_TOKEN_WARNING_THRESHOLD: ${OPENAI_AUDIO_OUTPUT_TOKEN_WARNING_THRESHOLD:-2048}
      OPENAI_AUDIO_TRANSCRIPTION_PROMPT: ${OPENAI_AUDIO_TRANSCRIPTION_PROMPT:-}
    volumes:
      - ./src:/app/src
      - ./apps:/app/apps
      - ./tests:/app/tests
      - ./db:/app/db
      - ./data/local:/app/data/local
    command: pytest

  dashboard:
    build:
      context: .
      args:
        INSTALL_APT_PACKAGES: ffmpeg chromium chromium-driver
        INSTALL_EXTRAS: media-browser
    image: personal-stock-investment-system-dev
    working_dir: /app
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      TIMEZONE: Asia/Taipei
      DATABASE_URL: sqlite:///data/local/personal-stock-investment.db
      ENABLE_LIVE_TRADING: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESEARCH_ANALYSIS_MODEL: ${OPENAI_RESEARCH_ANALYSIS_MODEL:-gpt-4.1-mini}
      OPENAI_RESEARCH_ANALYSIS_WEB_SEARCH: ${OPENAI_RESEARCH_ANALYSIS_WEB_SEARCH:-true}
      OPENAI_AUDIO_TRANSCRIPTION_MODEL: ${OPENAI_AUDIO_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_AUDIO_CHUNK_LENGTH_SECONDS: ${OPENAI_AUDIO_CHUNK_LENGTH_SECONDS:-180}
      OPENAI_AUDIO_OUTPUT_TOKEN_WARNING_THRESHOLD: ${OPENAI_AUDIO_OUTPUT_TOKEN_WARNING_THRESHOLD:-2048}
      OPENAI_AUDIO_TRANSCRIPTION_PROMPT: ${OPENAI_AUDIO_TRANSCRIPTION_PROMPT:-}
    volumes:
      - ./src:/app/src
      - ./apps:/app/apps
      - ./db:/app/db
      - ./data/local:/app/data/local
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
    ports:
      - "8501:8501"
    command:
      - python
      - -m
      - streamlit
      - run
      - apps/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

  pdf-tools:
    profiles:
      - pdf-tools
    build:
      context: .
      args:
        INSTALL_EXTRAS: pdf
    image: personal-stock-investment-system-pdf-tools
    working_dir: /app
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      TIMEZONE: Asia/Taipei
      DATABASE_URL: sqlite:///data/local/personal-stock-investment.db
      ENABLE_LIVE_TRADING: "false"
    volumes:
      - ./src:/app/src
      - ./apps:/app/apps
      - ./tests:/app/tests
      - ./docs:/app/docs
      - ./db:/app/db
      - ./data/local:/app/data/local
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
    command:
      - python
      - -c
      - "import pymupdf4llm; print('pymupdf4llm ready')"

  asr-tools:
    profiles:
      - asr-tools
    build:
      context: .
      args:
        INSTALL_APT_PACKAGES: ffmpeg git
        INSTALL_EXTRAS: asr
    image: personal-stock-investment-system-asr-tools
    working_dir: /app
    environment:
      APP_ENV: local
      LOG_LEVEL: info
      TIMEZONE: Asia/Taipei
      DATABASE_URL: sqlite:///data/local/personal-stock-investment.db
      ENABLE_LIVE_TRADING: "false"
    volumes:
      - ./src:/app/src
      - ./apps:/app/apps
      - ./tests:/app/tests
      - ./docs:/app/docs
      - ./db:/app/db
      - ./data/local:/app/data/local
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
      - ./data/local/asr-cache:/root/.cache
      - ./tools/external:/app/tools/external
    command:
      - python
      - -c
      - "import accelerate, datasets, torch, transformers; print('asr dependencies ready')"
